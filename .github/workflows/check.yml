name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: ECDEV governance format and lint
        run: |
          cargo fmt --manifest-path .ecdev/Cargo.toml --check
          cargo clippy --manifest-path .ecdev/Cargo.toml --all-targets -- -D warnings
      - name: ECDEV governance tests, including repository self-conformance
        run: cargo test --manifest-path .ecdev/Cargo.toml
      - name: ECDEV repository conformance (enforced)
        run: cargo run --manifest-path .ecdev/Cargo.toml -- conformance --root .
      - name: Repository shape and no crate buckets
        run: |
          cargo build --manifest-path .ecdev/Cargo.toml --lib
          rustc --edition=2021 tools/commerce/shape_gate.rs --extern ecdev_governance=.ecdev/target/debug/libecdev_governance.rlib -L dependency=.ecdev/target/debug/deps -o target/shape-gate
          target/shape-gate . > /tmp/repository-shape.json
          python tools/commerce/check_shape_gate.py target/shape-gate
      - run: pip install -r tools/commerce/requirements.txt
      - run: python tools/commerce/validate.py --records-only
      - run: npm ci --prefix tests/commerce
      - name: MCP and HTTP integration
        env:
          ECDEV_MAX_PROVIDER_REQUESTS_PER_DAY: '0'
        run: |
          cargo run --locked --package ecdev-server --bin ecdev -- server > /tmp/ecdev.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          node tests/commerce/mcp-smoke.mjs
      - name: Governance gate report
        run: |
          cargo run --manifest-path .ecdev/Cargo.toml -- extinction --root . > /tmp/extinction.txt
          cat /tmp/extinction.txt
          echo 'ECDEV repository conformance is enforced above; V1 extinction is reported, not asserted.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: governance-gate-report
          path: /tmp/extinction.txt
