name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Canonical regression tests except the unresolved repository shard gate
        run: cargo test --manifest-path .ynventa/Cargo.toml -- --skip dogfood_repository_conforms
      - run: cargo run --manifest-path .ynventa/Cargo.toml -- protocol --check --root .
      - run: pip install -r tools/commerce/requirements.txt
      - run: python tools/commerce/validate.py --records-only
      - run: npm ci --prefix tests/commerce
      - name: MCP and HTTP integration
        env:
          ECDEV_MAX_PROVIDER_REQUESTS_PER_DAY: '0'
        run: |
          cargo run --locked --package ecdev-server --bin ecdev -- server > /tmp/ecdev.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          node tests/commerce/mcp-smoke.mjs
      - name: Canonical gate report
        run: |
          cargo run --manifest-path .ynventa/Cargo.toml -- conformance --root . > /tmp/conformance.txt 2>&1 || true
          cat /tmp/conformance.txt
          echo 'ECDEV shard registration remains an unresolved upstream gate; this workflow verifies native code, not V1 extinction.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-gate-report
          path: /tmp/conformance.txt
