[workspace]
resolver = "2"
members = ["domain/commerce", "adapter/keepa", "adapter/web", "adapter/marketplace", "apps/server"]
exclude = [".ynventa"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
uuid = { version = "=1.23.1", features = ["v4", "serde"] }
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["full"] }
axum = "=0.7.9"
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
