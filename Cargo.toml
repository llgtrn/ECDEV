[workspace]
resolver = "2"
members = ["substrate/storage", "substrate/net", "domain/json-derive", "domain/commerce", "adapter/keepa", "adapter/web", "adapter/marketplace", "apps/server"]
exclude = [".ecdev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

# The store's replay suites run hundreds of thousands of statements; optimise it even in dev builds.
[profile.dev.package.ecdev-store]
opt-level = 3
